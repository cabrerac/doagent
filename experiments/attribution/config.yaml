# Deterministic addition run with a planted solver value and missed check.
query:
  a: 3
  b: 4
plant:
  plant_wrong_sum: 8
  plant_accept_wrong: true
run_config:
  logging_level: 2
storage: file
output_base: ./output

# Repetition counts for the two experiments.
# cost: executions of each capture condition (W, T, D0, D1, D2).
# executions: paired attribution executions, one trajectory each.
# judge: judge passes over the stored packs of one execution.
repeats:
  cost: 10
  executions: 1
  judge: 10

# Judge on the university proxy. Scores are not comparable with GPT-4o tables.
judge:
  provider: openai
  model: moonshotai/Kimi-K3
  temperature: 0
  methods:
    - all_at_once
    - step_by_step
    - binary_search
  views:
    - w
    - t
    - d0
    - d1
    - d2
