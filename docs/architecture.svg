<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="system-ui, Segoe UI, sans-serif" font-size="11">
  <defs>
    <linearGradient id="userBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8"/>
      <stop offset="100%" style="stop-color:#c5e3ed"/>
    </linearGradient>
    <linearGradient id="sessionBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7e8"/>
      <stop offset="100%" style="stop-color:#d4e8c4"/>
    </linearGradient>
    <linearGradient id="adapterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0e8"/>
      <stop offset="100%" style="stop-color:#e8dcc8"/>
    </linearGradient>
    <linearGradient id="implBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8f0"/>
      <stop offset="100%" style="stop-color:#d0d0e0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a9aa8"/>
    </marker>
  </defs>

  <!-- User / Public API -->
  <rect x="260" y="36" width="200" height="44" rx="6" fill="url(#userBg)" stroke="#5a9aa8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="52" text-anchor="middle" font-weight="600" fill="#2c3e50">Public API (doagent)</text>
  <text x="360" y="68" text-anchor="middle" fill="#444">Session, Config, Adapters</text>

  <!-- Arrow down from Public API -->
  <path d="M 360 80 L 360 100" stroke="#5a9aa8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Session layer (core) -->
  <rect x="80" y="108" width="560" height="100" rx="8" fill="url(#sessionBg)" stroke="#6b8e5a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="128" text-anchor="middle" font-weight="600" fill="#2c3e50">Session (core.session) - user entry point</text>

  <rect x="100" y="138" width="160" height="58" rx="4" fill="#fff" stroke="#6b8e5a" stroke-width="1"/>
  <text x="180" y="154" text-anchor="middle" font-weight="600" fill="#355">WrappedEnv</text>
  <text x="180" y="168" text-anchor="middle" fill="#555">env.step() -&gt; outcome</text>
  <text x="180" y="182" text-anchor="middle" fill="#555">+ trace records</text>

  <rect x="280" y="138" width="160" height="58" rx="4" fill="#fff" stroke="#6b8e5a" stroke-width="1"/>
  <text x="360" y="154" text-anchor="middle" font-weight="600" fill="#355">SessionAgent(s)</text>
  <text x="360" y="168" text-anchor="middle" fill="#555">obs -&gt; policy.decide()</text>
  <text x="360" y="182" text-anchor="middle" fill="#555">-&gt; agent_update</text>

  <rect x="460" y="138" width="160" height="58" rx="4" fill="#fff" stroke="#6b8e5a" stroke-width="1"/>
  <text x="540" y="154" text-anchor="middle" font-weight="600" fill="#355">RecordWriter</text>
  <text x="540" y="168" text-anchor="middle" fill="#555">level-gated writes</text>
  <text x="540" y="182" text-anchor="middle" fill="#555">dedup (state hash)</text>

  <!-- Arrows from Session components down -->
  <path d="M 180 196 L 180 228 L 280 228 L 280 248" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 2"/>
  <path d="M 360 196 L 360 248" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 2"/>
  <path d="M 540 196 L 540 228 L 440 228 L 440 248" stroke="#888" stroke-width="1" fill="none" stroke-dasharray="3 2"/>

  <!-- SharedDataAdapter protocol -->
  <rect x="180" y="248" width="360" height="52" rx="6" fill="url(#adapterBg)" stroke="#a08050" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="268" text-anchor="middle" font-weight="600" fill="#2c3e50">SharedDataAdapter</text>
  <text x="360" y="284" text-anchor="middle" fill="#555">write, read, list, listen, lookup, index</text>

  <!-- Arrow to implementations -->
  <path d="M 360 300 L 360 322" stroke="#a08050" stroke-width="1.5" fill="none"/>

  <!-- Adapter implementations -->
  <rect x="40" y="322" width="200" height="90" rx="6" fill="url(#implBg)" stroke="#6a6a8a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="342" text-anchor="middle" font-weight="600" fill="#2c3e50">Shared data implementations (core)</text>
  <rect x="55" y="352" width="85" height="24" rx="3" fill="#fff" stroke="#6a6a8a"/>
  <text x="97" y="368" text-anchor="middle" fill="#444">InMemory</text>
  <rect x="150" y="352" width="75" height="24" rx="3" fill="#fff" stroke="#6a6a8a"/>
  <text x="187" y="368" text-anchor="middle" fill="#444">File</text>
  <text x="140" y="398" text-anchor="middle" fill="#555" font-size="10">collection-per-kind</text>

  <!-- Records -->
  <rect x="260" y="322" width="200" height="90" rx="6" fill="#f8f0f0" stroke="#8a6a6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="342" text-anchor="middle" font-weight="600" fill="#2c3e50">Records (records)</text>
  <text x="360" y="362" text-anchor="middle" fill="#444">Agent Update, Outcome,</text>
  <text x="360" y="382" text-anchor="middle" fill="#444">Trace, Explanation,</text>
  <text x="360" y="402" text-anchor="middle" fill="#555" font-size="10">Provenance, Accountability.</text>

  <!-- Topology + Participation -->
  <rect x="480" y="322" width="200" height="90" rx="6" fill="#f0f0f8" stroke="#6a6a8a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="580" y="342" text-anchor="middle" font-weight="600" fill="#2c3e50">Decentralisation &amp; Openness (core)</text>
  <text x="580" y="362" text-anchor="middle" fill="#444">Fentralised, Federated, P2P</text>
  <text x="580" y="382" text-anchor="middle" fill="#444">TopologyConfig</text>
  <text x="580" y="402" text-anchor="middle" fill="#555" font-size="10">ParticipationRegistry</text>

  <!-- Validation (optional) -->
  <rect x="80" y="428" width="560" height="44" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="360" y="448" text-anchor="middle" font-weight="600" fill="#555">Validation (optional): PolicyRegistry, ValidationEnv, push / gridworld scenarios, RunReporter</text>
  <text x="360" y="462" text-anchor="middle" fill="#777" font-size="10">examples.validation</text>

  <!-- Data flow label -->
  <text x="20" y="270" fill="#666" font-size="9" transform="rotate(-90 20 270)">writes / reads</text>
</svg>
