run:
  id: "topo-peer-to-peer"
  seed: 42
  rounds: 50
  deterministic: true

scenario:
  name: "gridworld_mapping"
  render: false
  print_every: 0
  env:
    width: 15
    height: 15
    landmarks: 0
    observation_radius: 1
    max_cycles: 100
  topology:
    mode: "peer_to_peer"
    visibility:
      agent_0: ["agent_1"]
      agent_1: ["agent_2"]
      agent_2: ["agent_3"]
      agent_3: ["agent_0"]

agents:
  - id: "agent_0"
    policy:
      name: "grid_frontier"
      params: {}
  - id: "agent_1"
    policy:
      name: "grid_random"
      params:
        seed: 1
  - id: "agent_2"
    policy:
      name: "grid_auction_frontier"
      params:
        seed: 2
  - id: "agent_3"
    policy:
      name: "grid_random"
      params:
        seed: 3
