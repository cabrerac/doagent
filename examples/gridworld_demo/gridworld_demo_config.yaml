run:
  id: "gridworld-demo-001"
  seed: 999
  rounds: 100
  deterministic: true

scenario:
  name: "gridworld_mapping"
  storage: "file"   # default; records in output/<run_id>/records/
  #storage: "mongo"  # records in MongoDB; requires pymongo and a running Mongo server
  #mongo_uri: "mongodb://localhost:27017"  # optional when storage is mongo
  render: true
  render_mode: "human"
  print_every: 10
  # render_delay: 0.3  # seconds between frames (default 0.3 when human)
  env:
    width: 15
    height: 15
    landmarks: 2
    observation_radius: 1
    max_cycles: 100
  topology:
    mode: "peer_to_peer"
    visibility:
      agent_0: ["agent_1"]
      agent_1: ["agent_2"]
      agent_3: ["agent_0", "agent_1"]
  participation:
    energy_model: true
    energy_min: 8
    energy_max: 10
    energy_decay: 1
    energy_recharge: 1
    energy_leave_threshold: 2

agents:
  - id: "agent_0"
    policy:
      name: "grid_frontier"
      params: {}
  - id: "agent_1"
    policy:
      name: "grid_random"
      params:
        seed: 1
  - id: "agent_2"
    policy:
      name: "grid_auction_frontier"
      params:
        seed: 2
  - id: "agent_3"
    policy:
      name: "grid_random"
      params:
        seed: 3
